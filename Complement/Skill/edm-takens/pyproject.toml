# pyproject.toml — edm-takens editable install (debt-17)
#
# 允许通过 `pip install -e .` 将 src/ 下的模块安装为可编辑包，
# 使 `import pipeline`、`import sovereign_havok` 等在任何工作目录下
# 均可使用，无需手动操作 sys.path。
#
# 安装后，edm-takens-web/backend/api.py 中的 sys.path.append(...)
# 仅作为未安装时的回退机制；已安装的可编辑包具有更高导入优先级。

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edm-takens"
version = "0.1.0"
description = "EDM-Takens: Empirical Dynamic Modeling with HAVOK dynamics"
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "_numpy_edm",
    "sovereign_havok",
    "pipeline",
    "edm_auditor",
    "enhanced_cross_validate",
    "environment_check",
    "final_interpretation",
    "ccm_causality",
    "_edm_bridge",
    "_paths",
    "verify_algorithms",
    "edm_adaptive_pipeline",
    "edm_tau_optimization",
    "sensitivity_config",
    "router",
    "surrogate_test",
    "multiview_svd_monitor",
    "_usability",
]
