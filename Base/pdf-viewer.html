<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献阅览室 - PDF.js 阅读器</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<div class="pdf-container">

    <div class="totem-container">
        <img src="IMAGE/totem.png" alt="" class="totem-image">
    </div>

    <h1>📚 文献阅览室</h1>

    <div id="pdf-list"></div>
    <a class="pdf-link" href="index.html">返回主页</a>

</div>

<a href="#" id="back-to-top" title="返回顶部">↑</a>

<script>
    const pdfFiles = [
        {
            title: "源始",
            file: "https://raw.githubusercontent.com/SAY683/Annals-of-the-Great-Simplicity/main/Miscellanies/%E6%BA%90%E5%A7%8B.pdf"
        },
        {
            title: "太易 - 太伊原枢（纪录）",
            file: "https://raw.githubusercontent.com/SAY683/Annals-of-the-Great-Simplicity/main/Miscellanies/%E5%A4%AA%E6%98%93%20-%20%E5%A4%AA%E4%BC%8A%E5%8E%9F%E6%9E%A2%EF%BC%88%E7%BA%AA%E5%BD%95%EF%BC%89.pdf"
        },
        {
            title: "P0P1-VTS模型",
            file: "https://raw.githubusercontent.com/SAY683/Annals-of-the-Great-Simplicity/main/Miscellanies/P0P1-VTS%E6%A8%A1%E5%9E%8B.pdf"
        },
        {
            title: "人偶之匣（魔女的盒子）",
            file: "https://raw.githubusercontent.com/SAY683/Annals-of-the-Great-Simplicity/main/Miscellanies/%E4%BA%BA%E5%81%B6%E4%B9%8B%E5%8C%A3%EF%BC%88%E9%AD%94%E5%A5%B3%E7%9A%84%E7%9B%92%E5%AD%90%EF%BC%89.pdf"
        }
    ];

    const pdfJsViewer = "https://mozilla.github.io/pdf.js/web/viewer.html?file=";
    const listContainer = document.getElementById("pdf-list");

    pdfFiles.forEach(pdf => {
        const link = document.createElement("a");
        link.className = "pdf-link";
        link.href = pdfJsViewer + encodeURIComponent(pdf.file);
        link.textContent = `阅读《${pdf.title}》`;
        link.target = "_blank";
        listContainer.appendChild(link);
    });
</script>

<script src="JS/main.js"></script>

</body>
</html>
