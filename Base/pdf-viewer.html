<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献阅览室 - PDF.js 阅读器</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<div class="pdf-container">

    <div class="totem-container">
        <img src="IMAGE/totem.png" alt="" class="totem-image">
    </div>

    <h1>📚 文献阅览室</h1>

    <div id="pdf-list"></div>
    <a class="pdf-link" href="index.html">返回主页</a>

</div>

<a href="#" id="back-to-top" title="返回顶部">↑</a>

<!-- 1. 首先引入存储 PDF 列表的数据文件 -->
<script src="JS/pdf-data.js"></script>

<!-- 2. 然后，再执行使用这些数据的页面逻辑 -->
<script>
    const pdfJsViewer = "https://mozilla.github.io/pdf.js/web/viewer.html?file=";
    const listContainer = document.getElementById("pdf-list");

    pdfFiles.forEach(pdf => {
        const link = document.createElement("a");
        link.className = "pdf-link";
        link.href = pdfJsViewer + encodeURIComponent(pdf.file);
        link.textContent = `阅读《${pdf.title}》`;
        link.target = "_blank";
        listContainer.appendChild(link);
    });
</script>

<!-- 3. 最后引入全站通用的交互脚本 -->
<script src="JS/main.js"></script>

</body>
</html>
