<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献阅览室 - PDF.js 阅读器</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<div class="pdf-container">

    <div class="totem-container">
        <img src="IMAGE/totem.png" alt="" class="totem-image">
    </div>

    <h1>📚 文献阅览室</h1>

    <!-- 升级：使用新的加载动画和文本 -->
    <div id="pdf-list">
        <div class="loader-container">
            <div class="loader"></div>
            <p class="loading-text">正在校验文献链接，请稍候...</p>
        </div>
    </div>
    
    <a class="pdf-link" href="index.html">返回主页</a>

</div>

<a href="#" id="back-to-top" title="返回顶部">↑</a>

<script src="JS/pdf-data.js"></script>

<script>
    const pdfJsViewer = "https://mozilla.github.io/pdf.js/web/viewer.html?file=";
    const listContainer = document.getElementById("pdf-list");

    // 智能选择最佳PDF链接的函数 (此函数保持不变)
    async function getBestPdfUrl(pdf) {
        const remoteUrl = pdf.remoteFile;
        const localUrl = new URL(pdf.localFile, window.location.href).href;

          // 设置一个1800毫秒（1.8秒）的超时Promise
        const timeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject(new Error('Timeout')), 1800)
        );

        try {
            await Promise.race([
                fetch(remoteUrl, { mode: 'no-cors' }),
                timeoutPromise
            ]);
            console.log(`'${pdf.title}' 使用远程链接.`);
            return remoteUrl;
        } catch (error) {
            console.log(`'${pdf.title}' 链接超时或失败, 回退至本地链接.`);
            return localUrl;
        }
    }

    // 升级：并行生成所有链接
    async function generateLinksParallel() {
        // 1. 创建一个包含所有检测任务 (Promise) 的数组
        const checkPromises = pdfFiles.map(pdf => getBestPdfUrl(pdf));
        
        // 2. 使用 Promise.all 等待所有检测任务并行完成
        const bestUrls = await Promise.all(checkPromises);
        
        // 3. 清空加载动画
        listContainer.innerHTML = '';

        // 4. 一次性将所有已确认的链接渲染到页面上
        pdfFiles.forEach((pdf, index) => {
            const bestUrl = bestUrls[index]; // 从结果数组中获取对应的最佳链接

            const link = document.createElement("a");
            link.className = "pdf-link";
            link.href = pdfJsViewer + encodeURIComponent(bestUrl);
            link.textContent = `阅读《${pdf.title}》`;
            link.target = "_blank";
            listContainer.appendChild(link);
        });
    }

    // 启动并行链接生成过程
    generateLinksParallel();

</script>

<script src="JS/main.js"></script>

</body>
</html>
