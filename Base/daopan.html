    <a class="site-header-brand" href="index.html" aria-label="太易 · AGS 主页">

        <span>太易 · AGS</span>

    <button class="site-nav-toggle" aria-label="打开导航" aria-expanded="false" aria-controls="site-nav-panel" type="button">

    <nav class="site-nav" id="site-nav-panel" aria-label="全站导航">

    </nav>
</header>

<div class="container">
    <div class="totem-container">
        <img src="IMAGE/totem_icon.png" alt="" class="totem-image">
    </div>
    <h1>道盘推演</h1>
    <p class="intro-text">
        此乃心象之沙盘，映照内在之阵列。请依序布列四令，以定基盘；而后开启八门，运转神将，观其流转生克，洞悉当下之时局。
    </p>
    <div id="daopan-interactive-area">
        <div id="daopan-side-panel">
            <div id="daopan-controls">
                <div class="control-group">
                    <label for="ruling-selector">全局遁局</label>
                    <select id="ruling-selector">
                        <option value="moon">月家奇将 (奇遁)</option>
                        <option value="sun">日家偶将 (偶遁)</option>
                    </select>
                </div>
                <button id="toggle-acupoints-btn" class="link-card-button secondary">查看穴位</button>
                <button id="reset-daopan-btn" class="link-card-button secondary">重置道盘</button>
                <button id="download-image-btn" class="link-card-button" disabled>下载推演结果 (PNG)</button>
            </div>
            <div id="edict-bank-container">
                <h4>四令备选</h4>
                <div id="edict-bank"></div>
            </div>
            <div id="current-phase-display">
                <small>当前阶段</small>
                <p>请拖拽“四令”至“本宫”</p>
            </div>
        </div>
        <div id="daopan-container">
            <div class="daopan-title">道盘</div>
            <div class="daopan-grid"></div>
        </div>
    </div>

    <div id="advanced-play-area" class="hidden">
        <hr>
        <h2>高阶推演</h2>
        <div id="jump-pan-controls">
            <h3>跳盘 · 交宫穴极</h3>
            <p>推演已完成。现在可根据遁局规则进行“跳盘”操作。请点击盘面上高亮的“本宫”以确认联动跳盘。</p>
            <div id="jump-pan-info"></div>
        </div>
        
        <div id="gods-eye-area">
            <h3>神之眼 · 四象之刻</h3>
            <div id="gods-eye-toggle-buttons">
                <button class="link-card-button secondary active" data-view="before">观 · 未跳之象</button>
                <button class="link-card-button secondary hidden" data-view="after">察 · 已跳之局</button>
            </div>
            <div id="gods-eye-container">
                <div class="quadrant" id="quadrant-ne">
                    <div class="quadrant-header">
                        <h4 class="quadrant-title"></h4>
                        <button class="flip-btn" title="左右翻转象内数据">⇄</button>
                    </div>
                    <div class="gods-eye-display"></div>
                </div>
                <div class="quadrant" id="quadrant-se">
                     <div class="quadrant-header">
                        <h4 class="quadrant-title"></h4>
                        <button class="flip-btn" title="左右翻转象内数据">⇄</button>
                    </div>
                    <div class="gods-eye-display"></div>
                </div>
                <div class="quadrant" id="quadrant-sw">
                     <div class="quadrant-header">
                        <h4 class="quadrant-title"></h4>
                        <button class="flip-btn" title="左右翻转象内数据">⇄</button>
                    </div>
                    <div class="gods-eye-display"></div>
                </div>
                <div class="quadrant" id="quadrant-nw">
                     <div class="quadrant-header">
                        <h4 class="quadrant-title"></h4>
                        <button class="flip-btn" title="左右翻转象内数据">⇄</button>
                    </div>
                    <div class="gods-eye-display"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p><a href="glossary.html">返回词典</a> | <a href="index.html">返回主页</a></p>
    </footer>
</div>

<div id="selection-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title">选择</h3>
        <div id="modal-options-container"></div>
        <button id="modal-close-btn" class="link-card-button secondary">关闭</button>
    </div>
</div>

<div id="daopan-tooltip"></div>

<a href="#" id="back-to-top" title="返回顶部">↑</a>

</body>
