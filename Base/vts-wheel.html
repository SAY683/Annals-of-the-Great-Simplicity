<div class="container">

    <div class="totem-container">
        <img src="IMAGE/totem_icon.png" alt="" class="totem-image">

    <h1>VTS 原型之轮</h1>
    <p class="intro-text">
        此乃心识之镜，映照内在结构。V (Vision) 为低熵之“朴明”，是为元亨；T (Tactic) 为中熵之“权德”，是为态式；S (Strategy) 为高熵之“质性”，是为流理。请从两侧原型库中，引 ArcheType 入位，以观照您当下的心识图谱。
    </p>

    <div class="vts-interactive-area">
        <!-- 左侧原型库 -->
        <div class="archetype-bank" id="bank-left">
            <!-- 原型将由 JS 动态加载 -->
        </div>

        <!-- 中央 VTS 轮盘 -->
        <div class="vts-wheel">
            <div class="drop-zone" id="drop-zone-v" data-slot="V">
                <div class="zone-info">
                    <h3 class="zone-title">V <small>Vision</small></h3>
                    <p class="zone-concepts">朴明 · 元亨 · 萨埵</p>
                    <p class="zone-entropy">低熵</p>
                </div>
            </div>
            <div class="drop-zone" id="drop-zone-t" data-slot="T">
                <div class="zone-info">
                    <h3 class="zone-title">T <small>Tactic</small></h3>
                    <p class="zone-concepts">权德 · 态式 · 刺阇</p>
                    <p class="zone-entropy">中熵</p>
                </div>
            </div>
            <div class="drop-zone" id="drop-zone-s" data-slot="S">
                 <div class="zone-info">
                    <h3 class="zone-title">S <small>Strategy</small></h3>
                    <p class="zone-concepts">质性 · 流理 · 答摩</p>
                    <p class="zone-entropy">高熵</p>
                </div>
            </div>
        </div>

        <!-- 右侧原型库 -->
        <div class="archetype-bank" id="bank-right">
            <!-- 原型将由 JS 动态加载 -->
        </div>
    </div>

    <!-- 输出与下载区域 -->
     <div class="output-controls">
        <div class="input-group">
            <label for="layout-name">为此排盘命名:</label>
            <input type="text" id="layout-name" placeholder="例如：初始之探寻">
        </div>
        <div class="button-group">
            <button id="reset-btn" class="link-card-button secondary">重置排盘</button>
            <button id="download-btn" class="link-card-button" disabled>生成并下载排盘 (JSON)</button>
        </div>
    </div>
