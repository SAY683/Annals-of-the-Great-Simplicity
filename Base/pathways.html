<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>思想路径 · Annals of the Great Simplicity</title>
  <link rel="stylesheet" href="CSS/style.css">
  <meta name="referrer" content="no-referrer">
</head>
<body>
  <main id="pathways-root" class="pathway-wrap" role="main" aria-labelledby="pw-title" data-theme="auto">
    <header style="margin-bottom:1rem;">
      <h1 id="pw-title" style="margin:0 0 .4rem 0;font-size:1.4rem;">思想路径 · 推荐顺序</h1>
      <p class="small" style="margin:0 0 .8rem 0;">从包到核心，再分支为现代（项目）或炼金（注释），最后回归为支点页沉淀。</p>
      <div style="height:10px;background:rgba(255,255,255,0.03);border-radius:10px;overflow:hidden;margin-bottom:.6rem;">
        <div id="progressFill" style="height:100%;width:0;background:linear-gradient(90deg,#66a6d6,#9fd2f3);transition:width .35s ease;"></div>
      </div>
      <div style="text-align:right;font-size:.9rem;color:inherit;" id="progressLabel">已读 0 / 0</div>
    </header>

    <div class="pathway-main">
      <!-- LEFT: NODES LIST -->
      <aside>
        <h2 class="small">阅读节点</h2>
        <div id="nodesList" aria-live="polite" style="margin-top:.6rem;"></div>
      </aside>

      <!-- CENTER: MAP -->
      <section class="pathway-map">
        <div class="map-toolbar" aria-hidden="true">
          <button id="zoomOut" title="缩小">A−</button>
          <button id="zoomReset" title="重置">100%</button>
          <button id="zoomIn" title="放大">A+</button>
        </div>
        <div id="svgMap" style="width:100%;height:420px;"></div>
      </section>

      <!-- RIGHT: DETAIL -->
      <section class="panel" aria-live="polite">
        <h2 id="detailTitle">请选择一个节点</h2>
        <div id="detailDesc" style="margin-top:.6rem;color:inherit;"></div>
        <div id="detailTags" style="margin-top:.6rem;"></div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button id="openLink" class="btn">打开</button>
          <button id="markRead" class="btn">标记已读</button>
          <button id="nextBtn" class="btn">下一步</button>
        </div>
      </section>
    </div>

    <footer style="margin-top:1.2rem;display:flex;gap:8px;flex-wrap:wrap;">
      <button id="markAll" class="btn">全部标记已读</button>
      <button id="resetAll" class="btn">重置</button>
      <button id="exportProgress" class="btn">导出进度</button>
    </footer>
  </main>

  <!-- 外部脚本（覆盖旧的 js/pathways.js） -->
  <script src="JS/pathways.js" defer></script>
</body>
</html>
