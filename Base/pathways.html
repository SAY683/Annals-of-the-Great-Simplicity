<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>思路路径 — 太易</title>

  <!-- 复用你站点的主样式表（不要改动现有 style.css 文件名/路径） -->
  <link rel="stylesheet" href="/style.css">

  <!-- 页面专用微调，尽量与原风格保持一致 -->
  <style>
    /* 页面容器 */
    .pathway-wrap { max-width: 1100px; margin: 3rem auto; padding: 2rem; background: rgba(255,255,255,0.02); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); }
    .pathway-header { display:flex; align-items:center; gap:1rem; margin-bottom:1.2rem; }
    .pathway-header h1 { margin:0; font-size:1.6rem; }
    .progress-bar { flex:1; height:10px; background:#222; border-radius:6px; overflow:hidden; box-shadow:inset 0 1px 0 rgba(255,255,255,0.02); }
    .progress-fill { height:100%; background: linear-gradient(90deg,#6ea1c8,#8fc1e6); width:0%; transition:width .35s ease; }

    .layout { display:grid; grid-template-columns: 360px 1fr; gap:1.2rem; }
    .panel { background: rgba(0,0,0,0.03); padding:1rem; border-radius:8px; min-height:320px; }
    .node { padding: .6rem; border-left:3px solid transparent; margin-bottom:.5rem; cursor:pointer; border-radius:4px; }
    .node:hover { background: rgba(255,255,255,0.02); }
    .node.active { border-left-color:#6ea1c8; background: rgba(110,161,200,0.04); }
    .node h3 { margin:0; font-size:1rem; display:flex; justify-content:space-between; gap:.6rem; }
    .node p { margin:.35rem 0 0 0; font-size:.92rem; color: #bfcbd6; }

    .map { width:100%; height:420px; display:block; border-radius:6px; background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.02)); position:relative; }
    .detail { margin-top:.8rem; color:#dfeffb; line-height:1.6; font-size:0.98rem; }
    .controls { margin-top:1rem; display:flex; gap:.6rem; flex-wrap:wrap; }
    button.btn { background:transparent; border:1px solid rgba(255,255,255,0.06); color:inherit; padding:.45rem .7rem; border-radius:6px; cursor:pointer; }
    button.primary { border-color:#6ea1c8; background: linear-gradient(90deg, rgba(110,161,200,0.08), rgba(143,193,230,0.06)); }

    .tags { margin-top:.6rem; display:flex; gap:.4rem; flex-wrap:wrap; }
    .tag { padding:.18rem .45rem; background: rgba(255,255,255,0.02); border-radius:4px; font-size:.82rem; color:#9fb7cc; border: 1px solid rgba(255,255,255,0.02); }

    .small { font-size:.86rem; color:#9fb7cc; }
    .footnote { margin-top:1.2rem; font-size:.85rem; color:#9fb7cc; }

    /* responsive */
    @media (max-width:900px) {
      .layout { grid-template-columns: 1fr; }
      .map { height:320px; }
    }
  </style>
</head>
<body>
  <main class="container pathway-wrap" role="main">
    <div class="pathway-header">
      <h1>思想路径 · 推荐顺序</h1>
      <div class="progress-bar" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
      <div style="min-width:88px;text-align:right" class="small" id="progressLabel">已读 0 / 0</div>
    </div>

    <div class="layout">
      <!-- 左侧：节点列表 -->
      <aside class="panel" aria-labelledby="pathListTitle">
        <h2 id="pathListTitle" class="small">阅读节点（点击展开）</h2>
        <div id="nodesList" role="list" style="margin-top:.6rem"></div>

        <div class="controls">
          <button id="markAll" class="btn">全部标为已读</button>
          <button id="resetAll" class="btn">重置进度</button>
          <button id="exportProgress" class="btn">导出进度</button>
        </div>

        <div class="footnote">
          <div>提示：点击任一节点可在右侧地图中查看细节与推荐下一步。</div>
        </div>
      </aside>

      <!-- 右侧：可视化与详情 -->
      <section class="panel" aria-labelledby="mapTitle">
        <h2 id="mapTitle" class="small">路径地图</h2>

        <!-- 简单 SVG 地图 -->
        <div id="svgMap" class="map" aria-hidden="false">
          <!-- SVG 由 JS 注入 -->
        </div>

        <div id="detail" class="detail" aria-live="polite">
          <h3 id="detailTitle" style="margin:0 0 .4rem 0">选择一个节点开始</h3>
          <div id="detailDesc" style="color:#cfe9fb"></div>

          <div class="tags" id="detailTags"></div>

          <div class="controls" style="margin-top:.8rem">
            <button id="openLink" class="btn primary">打开资源</button>
            <button id="markRead" class="btn">标记已读</button>
            <button id="nextBtn" class="btn">下一步推荐</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="/JS/pathways.js"></script>
</body>
</html>
